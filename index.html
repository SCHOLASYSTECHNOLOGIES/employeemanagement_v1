async function api(action,payload={}){
  if(!API_URL || API_URL.includes('PASTE_')) return null;
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
    return await r.json();
  }catch(e){ console.warn('API',action,e); return null; }
}
async function loadRemote(force=false){
  if(!force && (remoteSyncBusy || pendingMutations>0)) return false;
  remoteSyncBusy=true;
  try{
    const r=await api('load');
    if(r&&r.ok&&r.db){
      db=r.db;
      ensureEmployeeData();
      saveLocal();
      remoteReady=true;
      return true;
    }
    ensureEmployeeData();
    return false;
  }finally{ remoteSyncBusy=false; }
}
function saveLocal(){localStorage.setItem('stsEmployeeDB',JSON.stringify(db));}
function save(){
  const run=async()=>{
    pendingMutations++;
    try{
      saveLocal();
      const snapshot=JSON.parse(JSON.stringify(db));
      const r=await api('save',{db:snapshot});
      if(!r||!r.ok) throw new Error((r&&r.error)||'Database synchronization failed');
      if(r.db){ db=r.db; ensureEmployeeData(); saveLocal(); }
      return db;
    }finally{ pendingMutations=Math.max(0,pendingMutations-1); }
  };
  saveQueue=saveQueue.then(run,run);
  return saveQueue;
}

function latestAttendanceFor(employeeId,date){
  const rows=db.attendance.filter(a=>String(a.trainerId)===String(employeeId)&&String(a.date)===String(date));
  if(!rows.length)return null;
  return rows.slice().sort((a,b)=>String(a.createdAt||a.id).localeCompare(String(b.createdAt||b.id))).pop();
}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function employeeAttendance(){let today=todayKey(),a=latestAttendanceFor(current.id,today),denied=a&&a.status==='Denied',pending=a&&a.status==='Pending Inspection';return `<div class="card"><div class="title"><div><h3>Daily Attendance</h3><p>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p></div><span class="badge ${denied?'absent':pending?'pending':a?'present':'pending'}">${denied?'Absent':pending?'Pending Inspection':a?'Present':'Not Marked'}</span></div>${a&&!denied?`<div class="section"><p><b>Recorded:</b> ${a.time}</p>${a.photo?`<img class="photo" src="${a.photo}">`:''}<p class="muted">${pending?'Attendance is awaiting Master inspection.':'Attendance approved by Master.'}</p></div>`:denied?`<div class="section"><div class="notice" style="border-left-color:var(--red)"><b>Attendance declined by Master.</b><div>Your attendance for today is marked <b>Absent</b>. You may capture a new attendance photo from the lab if required.</div></div>${attendanceCaptureMarkup()}</div>`:`<div class="section">${attendanceCaptureMarkup()}</div>`}</div><div class="section card"><div class="title"><div><h3>Attendance Calendar</h3><p>Green = Present · Red = Absent · Amber = Pending</p></div><span class="badge info">Current Month</span></div>${calendar()}</div>`}
function attendanceCaptureMarkup(){return `<div class="camera"><div><video id="video" autoplay playsinline></video><div class="actions" style="margin-top:10px"><button class="secondary" onclick="startCamera()">Enable Camera</button><button class="primary" onclick="captureAttendance()">Capture & Mark Attendance</button></div></div><div><div id="preview" class="upload">Camera preview will appear on the left. Capture one image for today's attendance.</div></div></div>`}
async function captureAttendance(){
  const v=document.getElementById('video');
  if(!v||!v.srcObject)return alert('Enable the camera first.');
  const today=todayKey();
  const existing=latestAttendanceFor(current.id,today);
  if(existing&&existing.status!=='Denied'){stopCamera();return alert('Attendance is already recorded for today.');}
  attendanceCanvas.width=v.videoWidth||640; attendanceCanvas.height=v.videoHeight||400;
  attendanceCanvas.getContext('2d').drawImage(v,0,0,attendanceCanvas.width,attendanceCanvas.height);
  const photo=attendanceCanvas.toDataURL('image/jpeg',.72);
  const id='AT-'+current.id+'-'+today+'-'+Date.now();
  const up=await api('uploadFile',{folder:'attendance',fileName:`${current.id}-${today}-${Date.now()}.jpg`,mimeType:'image/jpeg',data:photo.split(',')[1]});
  const rec={id,trainerId:current.id,name:current.name,date:today,time:new Date().toLocaleTimeString('en-IN'),photo:up&&up.ok?up.url:photo,status:'Pending Inspection',school:(db.allocations[current.id]||[])[0]||'',createdAt:new Date().toISOString()};
  const saved=await api('addAttendance',{record:rec});
  if(!saved||!saved.ok)return alert('Attendance could not be synchronized with the master system. Please try again.');
  if(saved.attendance) db.attendance=saved.attendance; else db.attendance=[...(db.attendance||[]),saved.record||rec];
  saveLocal(); stopCamera(); renderEmployee('Attendance');
}
function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),today=todayKey(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=latestAttendanceFor(current.id,ds),future=ds>today,cls=future?'upcoming-day':'unmarked-day',label='';if(!future&&a){if(a.status==='Approved'){cls='present-day';label='PRESENT'}else if(a.status==='Denied'){cls='absent-day';label='ABSENT'}else if(a.status==='Pending Inspection'){cls='pending-day';label='PENDING'}}cells+=`<div class="day ${cls}"><span class="n">${d}</span><small>${future?'':(label||'NOT MARKED')}</small></div>`}return `<div class="calendar-head"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar">${cells}</div>`}

async function submitReport(type){const f=document.getElementById('reportFile').files[0];if(!f)return alert('Select a file.');if(f.size>8*1024*1024)return alert('Please keep the report below 8 MB.');const data=await fileToDataURL(f);const up=await api('uploadFile',{folder:'reports',fileName:f.name,mimeType:f.type||'application/octet-stream',data:data.split(',')[1]});const r={id:Date.now(),trainerId:current.id,name:current.name,type,date:new Date().toISOString().slice(0,10),fileName:f.name,fileType:f.type,fileSize:f.size,status:'Submitted',fileUrl:up&&up.ok?up.url:''};db[type==='Weekly'?'weekly':'monthly'].unshift(r);await save();closeModal();renderEmployee('Reports');}

async function updateAttendanceWithRetry_(updated){
  let lastError='Attendance update failed';
  for(let attempt=0;attempt<12;attempt++){
    const r=await api('updateAttendanceBatch',{records:[updated]});
    if(r&&r.ok&&r.records&&r.records.length){
      if(r.attendance) db.attendance=r.attendance;
      return r.records[0];
    }
    lastError=(r&&r.error)||lastError;
    if(!r || !r.retryable) throw new Error(lastError);
    // Give the Apps Script lock a short chance to clear, then retry.
    await new Promise(resolve=>setTimeout(resolve,700+attempt*350));
  }
  throw new Error('Attendance server remained busy after automatic retries. '+lastError);
}
function enqueueAttendanceAction_(id,ok){
  if(attendanceActionsInFlight.has(String(id)))return;
  attendanceActionsInFlight.add(String(id));
  const task=async()=>{
    const a=db.attendance.find(x=>String(x.id)===String(id));
    if(!a)return;
    const updated=Object.assign({},a,{status:ok?'Approved':'Denied',inspectedBy:current.id,inspectedAt:new Date().toISOString()});
    try{
      await updateAttendanceWithRetry_(updated);
      saveLocal();
    }catch(err){
      alert('Attendance update could not be synchronized.\n\n'+err.message);
      throw err;
    }finally{attendanceActionsInFlight.delete(String(id));}
  };
  attendanceActionQueue=attendanceActionQueue.then(task,task);
  attendanceActionQueue.then(()=>{if(current&&mode==='master')renderMaster(window.activeMaster||'Inspection');}).catch(()=>{if(current&&mode==='master')renderMaster(window.activeMaster||'Inspection');});
}
function inspectAttendance(id,ok){enqueueAttendanceAction_(id,ok);}
async function manualMarkPresent(employeeId){
  const employee=employees.find(t=>t.id===employeeId); if(!employee)return;
  const today=todayKey(); const existing=latestAttendanceFor(employeeId,today);
  if(existing&&existing.status==='Approved')return alert('Attendance is already marked Present.');
  const rec={id:'MAN-'+employeeId+'-'+today+'-'+Date.now(),trainerId:employeeId,name:employee.name,date:today,time:new Date().toLocaleTimeString('en-IN'),photo:'',status:'Approved',school:(db.allocations[employeeId]||[])[0]||'',inspectedBy:current.id,inspectedAt:new Date().toISOString(),createdAt:new Date().toISOString()};
  const r=await api('addAttendance',{record:rec});
  if(!r||!r.ok)return alert((r&&r.error)||'Manual attendance could not be synchronized.');
  db.attendance=r.attendance||[...(db.attendance||[]),r.record||rec]; saveLocal(); renderMaster('AttendanceControl');
}
async function removeAttendance(id){
  if(!confirm('Remove this attendance record?'))return;
  const r=await api('deleteAttendance',{id:String(id)});
  if(!r||!r.ok)return alert((r&&r.error)||'Attendance could not be removed.');
  db.attendance=r.attendance||db.attendance.filter(a=>String(a.id)!==String(id)); saveLocal(); renderMaster('AttendanceControl');
}

async function leaveAction(id,status){let l=db.leaves.find(x=>x.id===id);if(!l)return;l.status=status;l.lastActionBy=current.id;l.history=l.history||[];l.history.push({actor:current.id,action:status});await save();renderMaster('Leave')}

  const sess=localStorage.getItem('stsEmployeeSession');
  if(sess){
    try{ current=JSON.parse(sess); mode=localStorage.getItem('stsEmployeeMode')||current.type||'employee'; document.getElementById('splash').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('loginView').classList.add('hidden'); document.getElementById('topUser').textContent=current.name+' · '+current.id; await loadRemote(); const active=localStorage.getItem('stsEmployeeActive')||'Overview'; mode==='master'?renderMaster(active):renderEmployee(active); }catch(e){ localStorage.removeItem('stsEmployeeSession'); }
  }
});
let lastRemoteFingerprint='';
setInterval(async()=>{
  if(!current||API_URL.includes('PASTE_')||pendingMutations>0||remoteSyncBusy)return;
  const activeEl=document.activeElement;
  const editing=activeEl && ['INPUT','TEXTAREA','SELECT'].includes(activeEl.tagName);
  const modalOpen=document.getElementById('modal') && !document.getElementById('modal').classList.contains('hidden');
  if(editing||modalOpen)return;
  const before=JSON.stringify((db.attendance||[]).filter(a=>a.trainerId===current.id).map(a=>[a.id,a.date,a.status,a.inspectedAt]));
  await loadRemote();
  const after=JSON.stringify((db.attendance||[]).filter(a=>a.trainerId===current.id).map(a=>[a.id,a.date,a.status,a.inspectedAt]));
  if(mode==='master' && ['Inspection','AttendanceControl','Attendance'].includes(window.activeMaster) && !pendingMutations && !remoteSyncBusy)renderMaster(window.activeMaster);
  if(mode==='employee' && before!==after && ['Attendance','Overview'].includes(window.activeEmployee||''))renderEmployee(window.activeEmployee||'Attendance');
},10000);
